# Netlify builds the game from this repo on every push to main.
[build]
  command = "python3 tools/build.py"
  publish = "dist/netlify/the-magic"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/models/*"
  [headers.values]
    Content-Type = "model/gltf-binary"
